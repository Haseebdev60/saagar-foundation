<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="50%" stop-color="#F4D15F" />
      <stop offset="100%" stop-color="#BD9636" />
    </linearGradient>
  </defs>

  <!-- Midnight Navy Base -->
  <rect width="128" height="128" rx="28" fill="#071020" />

  <!-- Outer Ring Accent -->
  <rect x="3" y="3" width="122" height="122" rx="26" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Gold Emblem Circle -->
  <circle cx="64" cy="54" r="36" fill="none" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Stylized Pledge / Crossed Fingers Hand In Gold -->
  <g transform="translate(64, 55)" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Palm / Base of hand -->
    <path d="M-12,18 C-12,12 -8,7 -4,6 L-4,0 C-4,-4 -1,-7 2,-7 C5,-7 8,-4 8,0 L8,6 C12,7 16,11 16,17 L16,21 C16,23 14,24 12,24 L-8,24 C-10,24 -12,22 -12,20 Z" fill="#071020" />
    <!-- Index Finger pointing up -->
    <path d="M-3,6 L-3,-16 C-3,-19 -0.5,-21 2,-21 C4.5,-21 7,-19 7,-16 L7,6" />
    <!-- Middle Finger crossed over -->
    <path d="M-7,6 L-7,-12 C-7,-15 -4.5,-18 -2,-18 C0.5,-18 3,-16 3,-13 L3,6" />
    <!-- Folded Ring & Pinky knuckles -->
    <path d="M7,-3 C11,-3 13,-1 13,3 L13,12" />
    <path d="M10,2 C14,2 16,4 16,8 L16,16" />
    <!-- Thumb resting across fingers -->
    <path d="M-8,14 C-4,11 0,10 6,10" />
  </g>

  <!-- Wordmark SAAGAR -->
  <text x="64" y="108" font-family="'Playfair Display', serif, Georgia" font-size="16" font-weight="700" letter-spacing="4" fill="url(#goldGrad)" text-anchor="middle">SAAGAR</text>
</svg>
